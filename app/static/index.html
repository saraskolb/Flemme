<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Flemme</title>
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <h1>Flemme</h1>
        <div class="top-status">
          <span id="health-pill" class="status-pill">Graph</span>
          <span id="gps-status" class="gps-status">GPS idle</span>
        </div>
      </header>

      <section class="map-panel" aria-label="Route map">
        <div id="map" class="route-map" role="img" aria-label="Route map"></div>
      </section>

      <section class="query-panel" aria-label="Route query">
        <div class="sheet-handle" aria-hidden="true"></div>

        <form id="route-form" class="route-form">
          <div class="address-grid">
            <label class="wide-field location-field">
              <span>Start</span>
              <div class="input-action-row">
                <input
                  id="origin-address"
                  name="origin-address"
                  autocomplete="street-address"
                  placeholder="Start address or place"
                />
                <button id="use-location-button" type="button">Use My Location</button>
              </div>
            </label>
            <label class="wide-field">
              <span>Destination</span>
              <input
                id="destination-address"
                name="destination-address"
                autocomplete="street-address"
                placeholder="Destination address or place"
              />
            </label>
          </div>

          <div class="control-row">
            <label class="mode-field">
              <span>Mode</span>
              <select id="mode" name="mode">
                <option value="balanced" selected>Balanced</option>
                <option value="avoid_hills">Avoid hills</option>
                <option value="fastest">Fastest</option>
                <option value="accessibility">Accessibility</option>
              </select>
            </label>
            <button id="route-button" type="submit">Route</button>
          </div>

          <details class="coordinate-fields">
            <summary>Coordinates</summary>
            <div class="field-grid">
              <label>
                <span>Start Lat</span>
                <input id="origin-lat" name="origin-lat" inputmode="decimal" />
              </label>
              <label>
                <span>Start Lon</span>
                <input id="origin-lon" name="origin-lon" inputmode="decimal" />
              </label>
              <label>
                <span>Destination Lat</span>
                <input id="destination-lat" name="destination-lat" inputmode="decimal" />
              </label>
              <label>
                <span>Destination Lon</span>
                <input id="destination-lon" name="destination-lon" inputmode="decimal" />
              </label>
            </div>
          </details>
        </form>

        <div id="message" class="message" role="status"></div>
        <div id="route-tabs" class="route-tabs" aria-label="Routes"></div>
        <div id="summary" class="summary"></div>
        <section id="next-step" class="next-step" aria-label="Next step"></section>
        <section class="walk-tools" aria-label="Walk tools">
          <div class="walk-row">
            <button id="locate-button" type="button">Start GPS</button>
          </div>
          <div class="feedback-grid" aria-label="Route feedback">
            <button type="button" data-feedback-type="good_route">Good</button>
            <button type="button" data-feedback-type="weird_turn">Weird</button>
            <button type="button" data-feedback-type="too_steep">Steep</button>
            <button type="button" data-feedback-type="unsafe">Unsafe</button>
            <button type="button" data-feedback-type="bad_name">Name</button>
            <button type="button" data-feedback-type="other">Other</button>
          </div>
          <details class="note-details">
            <summary>Add note</summary>
            <label>
              <span>Note</span>
              <textarea id="feedback-note" rows="2" placeholder="Optional note"></textarea>
            </label>
          </details>
        </section>
        <details class="steps-details">
          <summary>All steps</summary>
          <ol id="directions" class="directions"></ol>
        </details>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
